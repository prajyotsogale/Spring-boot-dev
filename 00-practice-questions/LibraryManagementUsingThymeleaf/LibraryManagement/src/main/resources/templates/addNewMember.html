<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New Member</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h3>Members Directory</h3>
    <hr>
    <p class="h4 mb-4">Save Member</p>

    <form action="#" th:action="@{/save}"
          th:object="${member}" method="POST">
        <input type="hidden" th:field="*{id}"/>
        <input type="text" th:field="*{name}"
               placeholder="Name" class="form-control mb-4 w-25" />
        <input type="text" th:field="*{email}"
               placeholder="Email" class="form-control mb-4 w-25" />
        <input type="text" th:field="*{phone}"
               placeholder="Phone Number" class="form-control mb-4 w-25" />
        <input type="text" th:field="*{membershipDate}"
               placeholder="Joining Date" class="form-control mb-4 w-25" />
        <button type="submit" class="btn btn-info col-2">Save</button>
    </form>
    <hr>
    <a th:href="@{/}">Back to the list</a>
</div>
</body>
</html>
