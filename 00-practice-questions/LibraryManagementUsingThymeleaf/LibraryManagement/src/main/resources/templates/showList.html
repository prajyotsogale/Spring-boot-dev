<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h3>Members Directory</h3>
    <hr>
    <a th:href="@{/addMember}" class="btn btn-primary">Add Member</a>
    <table class="table table-bordered table-stripped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Joining Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tempMembers : ${members}">
                <td th:text="${tempMembers.name}"/>
                <td th:text="${tempMembers.email}"/>
                <td th:text="${tempMembers.phone}"/>
                <td th:text="${tempMembers.membershipDate}"/>
                <td>
                    <a th:href="@{/updateMember(memberId=${tempMembers.id})}"
                       class="btn btn-info">
                        Update
                    </a>
                    <a th:href="@{/delete(memberId=${tempMembers.id})}"
                       class="btn btn-danger"
                       onclick="if(!(confirm('Are you sure you want to delete this employee?'))) return false">
                        Delete
                    </a>
                </td>
            </tr>
        </tbody>

    </table>
</div>
</body>
</html>
