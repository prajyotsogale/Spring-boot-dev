<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h3>Student directory</h3>
    <hr>
    <p class="h4 mb-4">Save Employee</p>

    <form action="#" th:action="@{/save}" th:object="${student}"
          method="POST">

        <input type="text" placeholder="First Name"
               th:field="*{firstName}" class="form-control mb-4 w-25"/>
        <input type="text" placeholder="Last Name"
               th:field="*{lastName}" class="form-control mb-4 w-25"/>
        <input type="text" placeholder="Course Name"
               th:field="*{course}" class="form-control mb-4 w-25"/>
        <input type="text" placeholder="GPA"
               th:field="*{gpa}" class="form-control mb-4 w-25"/>
        <button type="submit" class="btn btn-info col-2">Save</button>
    </form>
    <hr>
    <a th:href="@{/}">back to previous page</a>
</div>
</body>
</html>
