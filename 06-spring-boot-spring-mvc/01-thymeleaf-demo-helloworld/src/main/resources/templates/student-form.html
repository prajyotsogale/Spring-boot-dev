<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Student Registration Form</title>
</head>
<body>
    <h3>Student Registration Form</h3>
    <form th:action="@{/processStudentForm}" th:object="${student}" method="POST">
        First Name: <input type="text" th:field="*{firstName}"/><br><br>
        Last Name: <input type="text" th:field="*{lastName}"/><br><br>
        Country:
        <select th:field="*{country}">
            <option th:each="tempCountry : ${countries}" th:value="${tempCountry}" th:text="${tempCountry}" />
        </select>
        <br><br>
        Favourite Programming Language:
        <input type="radio" th:field="*{favouriteLanguage}"
               th:each="tempLanguage : ${languages}"
               th:value="${tempLanguage}"
               th:text="${tempLanguage}" />
        <br><br>
        Favourite Operating System:
        <input type="checkbox" th:field="*{favouriteSystems}"
               th:each="tempSystems : ${operatingSystems}"
               th:value="${tempSystems}"
               th:text="${tempSystems}" />
        <br><br>
        <input type="submit" value="submit"/>
    </form>
</body>
</html>
