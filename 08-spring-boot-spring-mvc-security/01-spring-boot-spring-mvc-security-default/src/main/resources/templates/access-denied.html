<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .error-card-container {
            max-width: 420px;
            width: 100%;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: all 0.3s ease;
        }
        .gradient-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        .error-code {
            font-size: 64px;
            font-weight: 700;
            color: #667eea;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-4">

<div class="error-card-container">
    <div class="card shadow-lg p-4 p-md-5 rounded-3 text-center">
        <div class="card-body">
            <div class="mb-4">
                <!-- Show 403 or 404 dynamically -->
                <div class="error-code">403</div>
                <h1 class="fw-bold text-dark">Access Denied</h1>
                <p class="text-muted">
                    Sorry, you don’t have permission to view this page.<br>
                    If you think this is a mistake, contact support.
                </p>
            </div>

            <div class="d-grid gap-2">
                <!-- Go back -->
                <button onclick="history.back()" class="btn gradient-btn text-white fw-semibold p-2">
                    ← Go Back
                </button>
                <!-- Link to login -->
                <a th:href="@{/showMyLoginPage}" class="btn btn-outline-secondary fw-semibold p-2">
                    Go to Login
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
