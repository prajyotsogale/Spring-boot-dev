<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .home-card-container {
            max-width: 600px;
            width: 100%;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-4">
<div class="home-card-container">
    <div class="card shadow-lg p-4 p-md-5 rounded-3">
        <div class="card-body">
            <div class="text-center mb-4">
                <h1 class="card-title fw-bold text-dark">Company Home</h1>
                <p class="text-muted">Welcome to my company's home page</p>
            </div>

            <!-- Display username and role -->
            <div class="mb-4 text-center">
                <p>
                    <strong>User:</strong> <span sec:authentication="principal.username"></span><br>
                    <strong>Role(s):</strong> <span sec:authentication="principal.authorities"></span>
                </p>
            </div>

            <!-- Role-based links -->
            <div class="list-group mb-4">
                <div sec:authorize="hasRole('MANAGER')">
                    <a th:href="@{/leaders}" class="list-group-item list-group-item-action text-center">
                        Leadership Meeting <span class="text-muted small">(Managers only)</span>
                    </a>
                </div>
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/systems}" class="list-group-item list-group-item-action text-center">
                        IT Systems Meeting <span class="text-muted small">(Admins only)</span>
                    </a>
                </div>
            </div>

            <!-- Logout button -->
            <form th:action="@{/logout}" method="post" class="d-flex justify-content-center">
                <button type="submit" class="btn btn-gradient w-100 p-2 fw-semibold text-white">Logout</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
