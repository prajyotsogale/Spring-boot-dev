<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .login-card-container {
            max-width: 400px;
            width: 100%;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .alert-custom-error {
            color: #e74c3c;
            background-color: #fdf2f2;
            border-color: #e74c3c;
        }

        .register-link {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center p-4">
<div class="login-card-container">
    <div class="card shadow-lg p-4 p-md-5 rounded-3">
        <div class="card-body">
            <div class="text-center mb-4">
                <h1 class="card-title fw-bold text-dark">Welcome Back</h1>
                <p class="text-muted">Please sign in to your account</p>
            </div>
            <div th:if="${param.error}" class="alert alert-custom-error text-center" role="alert">
                <i>Invalid username or password. Please try again.</i>
            </div>
            <div th:if="${param.logout}" class="alert alert-info text-center" role="alert">
                <i>You have been Logged Out</i>
            </div>
            <form action="#" th:action="@{/authenticateTheUser}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-medium">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required
                           autocomplete="username" placeholder="Enter your username">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-medium">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required
                           autocomplete="current-password" placeholder="Enter your password">
                </div>
                <button type="submit" class="submit-btn btn btn-primary w-100 p-2 fw-semibold" name="Login">
                    Sign In
                </button>
            </form>
            <div class="register-link text-center">
                <p class="mb-0">Don't have an account?
                    <a th:href="@{/register}">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
