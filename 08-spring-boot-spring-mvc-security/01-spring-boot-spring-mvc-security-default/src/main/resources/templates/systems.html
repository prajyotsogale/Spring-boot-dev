<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Systems Meeting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .page-card-container {
            max-width: 600px;
            width: 100%;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-gradient:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-4">
<div class="page-card-container">
    <div class="card shadow-lg p-4 p-md-5 rounded-3">
        <div class="card-body text-center">
            <h1 class="card-title fw-bold text-dark">IT Systems Meeting</h1>
            <p class="text-muted">Restricted area for admins only.</p>
            <hr>
            <p class="lead">This section covers system upgrades, security audits, and infrastructure planning.</p>
            <div class="mt-4">
                <a th:href="@{/}" class="btn btn-gradient text-white fw-semibold">Back to Home</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
